<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOV">
<title>KOV · King of Volleyball</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("kov_theme");}catch(e){}
  if(t!=="light"&&t!=="dark") t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);
  try{if(window.KovNative&&KovNative.setBars)KovNative.setBars(t==="light");}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --card:#1a1a1a; --card2:#252525; --card3:#2f2f2f;
  --line:#2c2c2c; --mute:#8b8b8b; --mute2:#5f5f5f;
  --lime:#d4f34a; --lime2:#c2e23a; --ink:#111;
  --paper:#f1f1ee; --paper2:#e4e4e0;
  --r:30px;
  --fg:#fff; --acc:var(--lime); --ringoff:#3a3a3a; --ringon:var(--lime);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);overflow-x:hidden;
  font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px}

/* top */
.top{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.top .rb{width:44px;height:44px}
.top .rb svg{width:19px;height:19px}
.top .teamlogo{width:48px;height:48px}
.top .pillst{height:44px;padding:0 10px;gap:6px}
.top .pillst small{font-size:9.5px}
.top .pillst span{font-size:12.5px}
.themebtn{position:relative;overflow:hidden}
.themebtn svg{position:absolute;left:50%;top:50%;margin:-9.5px 0 0 -9.5px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.themebtn .sun{stroke:var(--lime)!important}
.themebtn .moon{opacity:0;transform:rotate(-90deg) scale(.5)}
html[data-theme=light] .themebtn .sun{opacity:0;transform:rotate(90deg) scale(.5)}
html[data-theme=light] .themebtn .moon{opacity:1;transform:none;stroke:#111}
.logo{width:48px;height:48px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;fill:var(--ink)}
.pillst{flex:1;height:48px;border-radius:30px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:#ddd;min-width:0;padding:0 14px}
.pillst i{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}
.pillst.off i{background:#ff9b4a}
.pillst .ptx{display:flex;flex-direction:column;line-height:1.1;min-width:0;text-align:left}
.pillst small{font-size:10.5px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.pillst span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;font-weight:700;color:#fff}
.rb{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.rb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb.on{background:var(--lime)}.rb.on svg{stroke:var(--ink)}
.rb.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1.big{font-size:38px;line-height:.98;font-weight:800;text-transform:uppercase;letter-spacing:-.6px;margin:0 0 10px}
h1.big .ar{display:inline-block;width:.72em;height:.72em;vertical-align:-.02em;margin-left:.08em}
h1.big .ar path{stroke:var(--lime);stroke-width:2.6;fill:none}
h1.big em{font-style:normal;color:var(--lime)}
.sub{color:var(--mute);font-size:14.5px;font-weight:500;margin:0 0 20px}

/* search */
.search{display:flex;align-items:center;gap:12px;padding:6px 18px 6px 6px;border-radius:40px;background:var(--card);margin-bottom:14px}
.search .ic{width:42px;height:42px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none}
.search .ic svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:15px;font-weight:500;color:#fff;width:100%}
.search input::placeholder{color:var(--mute)}
.results{background:var(--card);border-radius:26px;padding:6px;margin-bottom:14px;display:none}
.results.show{display:block}
.results button{display:flex;width:100%;align-items:center;gap:12px;padding:8px 10px;border-radius:20px;font-weight:600}
.results button:active{background:var(--card2)}
.results b{color:var(--lime)}

/* hero grid */
.hero{display:grid;grid-template-columns:calc(50% - 53px) 1fr;gap:10px;margin:8px 0 10px}
.gg{display:flex;flex-direction:column;padding:14px 12px 16px 14px}
.gg .nr{justify-content:flex-end}
.gg .gv{font-size:60px;font-weight:800;line-height:.95;letter-spacing:-2px;margin-top:4px}
.gg .l{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.gg .mv{font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap}
.gg .mv.nx{color:var(--lime)}
.rings.wide{padding:20px 10px 16px;margin-bottom:26px}
.rings.wide .rg{max-width:86px}
.rings.wide .rg .in svg{width:24px;height:24px}
.rings.wide .rv{font-size:24px;color:#fff}
.rings.wide .rl{font-size:12.5px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);border-radius:var(--r)}
.nums{padding:16px 14px 12px 18px}
.nr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nr .v{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.5px;white-space:nowrap}
.nr .v small{font-size:15px;font-weight:600;color:var(--mute2);margin-left:3px}
.nr .l{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:5px}
.cb{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.cb svg{width:18px;height:18px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dotline{border-top:2px dotted #333;margin:12px 0}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:14px 8px 12px;text-align:center}
.rg{position:relative;width:100%;max-width:58px;margin:0 auto}
.rg svg.d{width:100%;height:auto;display:block}
.rg .in{position:absolute;inset:0;display:grid;place-items:center}
.rg .in svg{width:17px;height:17px;stroke:#bdbdbd;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rv{font-size:17px;font-weight:700;margin-top:6px;color:#cfcfcf}
.rl{font-size:10.5px;color:var(--mute);font-weight:500;line-height:1.15}
.king{background:var(--lime);color:var(--ink);border-radius:var(--r);padding:16px 14px 14px;display:flex;flex-direction:column;align-items:stretch;height:100%;text-align:center}
.king .ringw{position:relative;width:100%;max-width:92px;margin:0 auto}
.king .ringw svg{width:100%;height:auto;display:block}
.king .ringw .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.king .ringw b{display:block;font-size:19px;font-weight:800;line-height:1;letter-spacing:-.5px}
.king .ringw span{font-size:9.5px;font-weight:600;color:rgba(17,17,17,.5)}
.king .lbl{align-self:center;margin-top:auto;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--lime);background:var(--ink);padding:6px 14px 5px;border-radius:30px;line-height:1.1}
.king .ringw{margin-bottom:12px}
.king .nm{font-size:27px;font-weight:800;line-height:1;margin:4px 0 6px;letter-spacing:-.4px;word-break:break-word}
.king .ds{font-size:13px;font-weight:600;color:rgba(17,17,17,.55)}
.blackbtn{display:block;width:100%;margin-top:12px;background:var(--ink);color:#fff;border-radius:30px;padding:13px;text-align:center;font-weight:700;font-size:15px}

/* section */
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.sec h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-.2px}
.sec .lk{font-size:14px;font-weight:600;color:var(--lime);display:flex;align-items:center;gap:4px}
.sec .ct{font-size:13px;font-weight:700;background:var(--lime);color:var(--ink);border-radius:20px;padding:4px 11px}

/* stacked cards */
.stack{margin-bottom:28px;display:flex;flex-direction:column}
.st{position:relative;display:flex;align-items:flex-start;justify-content:space-between;width:100%;padding:18px 22px 30px;border-radius:32px;overflow:hidden;box-shadow:0 -8px 22px rgba(0,0,0,.45)}
.st + .st{margin-top:-26px}
.st .bg{font-size:46px;font-weight:700;line-height:1;letter-spacing:-1.2px}
.st .who{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:5px}
.st .side{font-size:22px;font-weight:600;text-align:right;padding-top:8px}
.st .side small{display:block;font-size:11px;font-weight:600;opacity:.6}
.st.s1{background:var(--lime);color:var(--ink)}
.st:first-child{box-shadow:none}
.st:last-child{padding-bottom:20px}
.st.s2{background:#9a9a9a;color:#fff}
.st.s3{background:var(--card3);color:#fff}
.st > *{position:relative}
.pod .st{align-items:center;padding-bottom:40px}.pod .st.s3{padding-bottom:20px}
.pod .st .bg{font-size:32px;letter-spacing:-.6px}
.pod .st .who{font-size:20px;font-weight:800;text-transform:none;letter-spacing:-.2px;margin-top:4px;line-height:1.1}
.pod .st .who small{display:block;font-size:12px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

.pod .pw{width:100%;text-align:left}
.pod .pk{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.pod .pn{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.4px;margin:3px 0 10px}
.pod .ps{display:flex;gap:8px;flex-wrap:wrap}
.pod .ps span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:30px;background:rgba(0,0,0,.12);white-space:nowrap}
.pod .ps b{font-size:16px;font-weight:800;margin-right:2px}
.pod .s1 .ps span:first-child{background:var(--ink);color:var(--lime)}
.pod .s2 .ps span,.pod .s3 .ps span{background:rgba(255,255,255,.14)}
/* white chart card */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:18px 16px 14px;margin-bottom:28px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:0 2px 14px}
.ph b{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1}
.ph .s{font-size:13px;color:#777;font-weight:600;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--ink);font-weight:700;font-size:13px;padding:8px 13px;border-radius:30px;white-space:nowrap}
.chip svg{width:13px;height:13px;fill:var(--ink)}
.chip.dk{background:var(--card2);color:#fff}
.bars{display:flex;gap:8px;align-items:stretch;height:190px;overflow-x:auto;padding:46px 26px 0;margin:0 -16px;scrollbar-width:none}
.bars::-webkit-scrollbar{display:none}
.bc{flex:1 0 32px;display:flex;flex-direction:column;align-items:center;gap:7px}
.trk{flex:1;width:100%;border-radius:40px;background:var(--paper2);position:relative;display:flex;align-items:flex-end}
.fl{width:100%;border-radius:40px;background:var(--ink);min-height:30px;position:relative}
.fl.hi{background:var(--lime)}
.fl.no{background:transparent;min-height:0}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 9px;border-radius:12px;white-space:nowrap}
.tip::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:8px;background:var(--ink);transform:translateX(-50%)}
.fl.hi::before{content:"";position:absolute;top:10px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.bc label{font-size:10.5px;font-weight:600;color:#888;white-space:nowrap}
.dark .trk{background:var(--card2)}
.dark .fl{background:#3b3b3b}.dark .fl.hi{background:var(--lime)}
.dark .bc label{color:var(--mute)}
.dark .tip{background:#fff;color:var(--ink)}.dark .tip::after{background:#fff}
.fl em{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.fl.hi em{color:var(--ink)}
.dark .fl em{color:#ddd}.dark .fl.hi em{color:var(--ink)}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 10px;border-radius:40px;background:var(--card)}
.row:active{background:var(--card2)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--card3);color:#fff}
.av.l{background:var(--lime);color:var(--ink)}
.av.w{background:#fff;color:var(--ink)}
.av.p2{background:#9a9a9a;color:#fff}
.av.p3{background:var(--card3);color:#fff;box-shadow:inset 0 0 0 1.5px #4a4a4a}
.av.pn{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px #333}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12.5px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px;margin-top:1px}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--lime);color:var(--ink)}
.tg.g{background:#3a3a3a;color:#ddd}
.sc{display:flex;gap:4px;padding-right:4px}
.sc span{min-width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:14px;background:var(--card3);color:#aaa}
.sc .w{background:var(--lime);color:var(--ink)}
.pc{text-align:right;padding-right:10px;min-width:64px}
.pc b{font-size:19px;font-weight:700;display:block;line-height:1.05}
.pc small{font-size:11px;color:var(--mute);font-weight:600}
.bar{height:5px;border-radius:5px;background:#333;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--lime)}

/* seg */
.seg{display:flex;gap:6px;padding:6px;border-radius:40px;background:var(--card);margin-bottom:16px}
.seg button{flex:1;padding:12px 6px;border-radius:30px;font-size:14px;font-weight:700;color:#bbb;text-align:center}
.seg button.on{background:var(--lime);color:var(--ink)}
.note{font-size:13px;color:var(--mute);margin:-14px 8px 24px;line-height:1.5;font-weight:500}

/* money */
.cash{position:relative;overflow:hidden;background:var(--lime);color:var(--ink);border-radius:32px;padding:20px 22px 22px;margin-bottom:18px}
.cash .k{font-size:14px;font-weight:700;letter-spacing:.06em}
.cash .t{font-size:14px;font-weight:600;color:rgba(17,17,17,.55);margin-top:34px}
.cash .n{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.cash .ast{position:absolute;right:-26px;top:-26px;width:150px;height:150px;opacity:.9}
.cash .ast path{stroke:var(--lime2);stroke-width:13;stroke-linecap:butt;fill:none}
.cash .bt{position:absolute;right:20px;bottom:22px;font-size:15px;font-weight:800}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px;text-align:center}
.act .c{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fff;color:var(--ink);font-size:16px;font-weight:800}
.act .c.dk{background:var(--card2);color:#fff;box-shadow:inset 0 0 0 2px #3a3a3a}
.acts.four{grid-template-columns:repeat(4,1fr);gap:4px}
.acts.four .c{width:62px;height:62px;font-size:15px}
.acts.four.three{grid-template-columns:repeat(3,1fr)}
.act .c.bl{background:var(--card2);color:#5ec8ec;box-shadow:inset 0 0 0 2px #5ec8ec}
.act .c.gr{background:var(--card2);color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime)}
.act .c.nv{background:var(--card2);color:#ff9b4a;box-shadow:inset 0 0 0 2px #3a3a3a}
.act .t{font-size:13px;font-weight:600;color:#ccc}
.sheetw{background:var(--paper);color:var(--ink);border-radius:32px;padding:14px 10px 10px;margin-bottom:16px}
.sheetw .grab{width:40px;height:4px;border-radius:4px;background:#cfcfca;margin:0 auto 12px}
.sheetw h3{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;margin:0 10px 8px}
.wr{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:24px}
.wr:active{background:var(--paper2)}
.wr .av{background:var(--paper2);color:var(--ink);width:42px;height:42px}
.wr .mid{flex:1;min-width:0}
.wr .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .ds{font-size:12.5px;color:#888;font-weight:500}
.wr .am{font-size:16px;font-weight:700;padding-right:6px;white-space:nowrap}
.wr .am.neg{color:#d9480f}
.wr .ok{width:30px;height:30px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin-right:6px}
.wr .ok svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2.6;fill:none}

/* rules */
.rules{background:var(--card);border-radius:var(--r);padding:20px;font-size:15px;line-height:1.6;white-space:pre-line;color:#ddd;font-weight:500}
.rules b{color:var(--lime)}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:6px;padding:6px;border-radius:44px;
  background:rgba(26,26,26,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(0,0,0,.6),inset 0 0 0 1px #2c2c2c;z-index:20}
.tabbar button{height:54px;min-width:54px;border-radius:30px;background:var(--card3);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;transition:all .25s ease}
.tabbar svg{width:20px;height:20px;stroke:#ddd;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar span{display:none;font-size:15px;font-weight:700}
.tabbar button.on{background:var(--lime);color:var(--ink);padding:0 22px}
.tabbar button.on span{display:inline}
.tabbar button.on svg{stroke:var(--ink)}

.teamlogo{width:52px;height:52px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 2px #1a1a1a}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  animation:spOut .55s cubic-bezier(.7,0,.3,1) 1.9s forwards}
.splash img{width:min(62vw,260px);height:auto;border-radius:50%;transform:translateY(110vh);animation:spIn 1.05s cubic-bezier(.16,1,.3,1) .15s forwards;
  filter:drop-shadow(0 18px 40px rgba(77,190,230,.25))}
.splash .sp-t{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;opacity:0;transform:translateY(30px);animation:spTx .6s ease .8s forwards}
.splash .sp-t em{font-style:normal;color:var(--lime)}
@keyframes spIn{to{transform:none}}
@keyframes spTx{to{opacity:1;transform:none}}
@keyframes spOut{to{transform:translateY(-100%);visibility:hidden}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-20px);opacity:0;background:var(--lime);color:var(--ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:30px;z-index:40;transition:all .25s ease;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.rhero{background:var(--lime);color:var(--ink);border-radius:32px;padding:18px 18px 20px;margin-bottom:14px}

.rchips{display:flex;flex-wrap:wrap;gap:8px}

.rsec{background:var(--card);border-radius:30px;padding:18px 14px 14px;margin-bottom:14px}

.rfact .tx{font-size:15px;line-height:1.5;color:#d6d6d6;font-weight:500;padding-top:7px;min-width:0}
.rfact b,.rintro b,.rsteps b{color:var(--lime);font-weight:700}
.rintro{font-size:14.5px;color:var(--mute);font-weight:600;margin:6px 6px 12px;line-height:1.45}
.rsteps{list-style:none;margin:0;padding:0;position:relative}

.rsteps .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px #3a3a3a}

.rsteps .n.p2{background:#9a9a9a;color:#fff;box-shadow:none}
.rsteps .n.p3{background:var(--card3);color:#fff;box-shadow:inset 0 0 0 1.5px #4a4a4a}
.rsteps .t{flex:1;font-size:15px;font-weight:700}
.rsteps .tg{font-size:11px;font-weight:800;background:var(--lime);color:var(--ink);padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.rteams{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.rteams .tm{display:flex;gap:4px}

.rteams .tm.l span{background:var(--lime);color:var(--ink)}
.rteams .vs{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--mute)}
.phist{background:var(--card);border-radius:28px;padding:6px 8px;margin-bottom:10px}
.ph-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 8px;border-top:1px solid var(--line)}
.ph-r:first-child{border-top:0}
.ph-d b{display:block;font-size:15px;font-weight:700}
.ph-d span{font-size:12px;color:var(--mute);font-weight:600}
.ph-ok,.ph-no{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap}
.ph-ok{background:var(--lime);color:#111}
.ph-ok svg{width:14px;height:14px;stroke:#111;stroke-width:2.6;fill:none}
.ph-no{background:rgba(255,155,74,.16);color:#ff9b4a;box-shadow:inset 0 0 0 1.5px #ff9b4a}
[data-theme="light"] .ph-no{background:rgba(217,72,15,.08);color:#c2410c;box-shadow:inset 0 0 0 1.5px #d9480f}
.paper.pres{padding:8px 8px 8px 20px;border-radius:40px}
.paper.pres.open{padding:10px 10px 14px 16px;border-radius:var(--r)}
.pres-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);font-size:15px;font-weight:600;text-align:left}
.pres-h b{font-size:21px;font-weight:800;margin-right:3px;letter-spacing:-.3px}
.pres-t{width:40px;height:40px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500;line-height:1;transition:transform .25s}
.paper.pres.open .pres-t{transform:rotate(45deg)}
.paper.pres.open .bars{margin-top:4px}
.pres-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
.paper.pres.open .pres-b{grid-template-rows:1fr}
.pres-in{overflow:hidden;min-height:0;opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.paper.pres.open .pres-in{opacity:1;transform:none;transition-delay:.08s}
.paper.pres{transition:border-radius .35s ease,padding .35s ease}
.paper.pres.open.anim .bc{animation:barUp .55s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes barUp{from{opacity:0;transform:translateY(26px) scaleY(.6)}to{opacity:1;transform:none}}
.bc:last-child .tip{left:auto;right:-6px;transform:none}
.bc:last-child .tip::after{left:auto;right:21px;transform:none}
.bc:first-child .tip{left:-6px;transform:none}
.bc:first-child .tip::after{left:21px;transform:none}
.reg-open h1.big,.reg-open .sub{animation:none}
.reg-open .rsec{transform-origin:top center;animation:secDrop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 120ms + 60ms)}
@keyframes secDrop{from{opacity:0;transform:translateY(-18px);clip-path:inset(0 0 100% 0 round 30px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 30px)}}
.reg-open .rfact,.reg-open .rsteps li{animation:barUp .5s cubic-bezier(.2,.9,.25,1.15) both}
.reg-open .rfact{animation-delay:calc(var(--d,0) * 120ms + 220ms)}
.reg-open .rsteps li{animation-delay:calc(var(--d,0) * 120ms + 260ms + var(--k,0) * 55ms)}
#rulesBtn svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#rulesBtn.on svg{transform:rotate(-8deg) scale(1.1)}
.act{text-align:center}
.vchi{font-size:11.5px;font-weight:700;color:#ff9b4a}
[data-theme="light"] .vchi{color:#c2410c}
.sheetw.debts{box-shadow:inset 0 0 0 2px #ff9b4a;scroll-margin-top:80px}
.sheetw.debts h3 .dtot{color:#d9480f;margin-left:6px}
.sheetw.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{transform:none}20%{transform:scale(1.02)}40%{transform:none}}
.fold{margin-bottom:28px}
.fold-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:40px;padding:8px 8px 8px 20px;font-size:15px;font-weight:700;color:var(--fg,#fff)}
.fold-h .pres-t{background:var(--acc,var(--lime));color:var(--bg)}
.fold .pres-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
.fold.open .pres-b{grid-template-rows:1fr}
.fold.open .pres-in{opacity:1;transform:none;transition-delay:.08s}
.fold.open .pres-t{transform:rotate(45deg)}
.fold.open .pres-in .row{animation:barUp .5s cubic-bezier(.2,.9,.25,1.15) both}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 40px}
.shtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.shtop .tt{font-size:15px;font-weight:600;color:var(--mute);text-align:center;line-height:1.2}
.shtop .tt b{display:block;color:#fff;font-size:16px}
.rkp{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px}
.kv{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:40px;background:var(--card);margin-bottom:8px}
.kv .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.kv .ic svg{width:18px;height:18px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kv .k{flex:1;font-size:15px;font-weight:600;color:#ddd}
.kv .v{font-size:17px;font-weight:800}
.kv .v.neg{color:#ff9b4a}.kv .v.ok{color:var(--lime)}
.empty{padding:28px 20px;text-align:center;color:var(--mute);font-size:15px;font-weight:500}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:360px){h1.big{font-size:32px}.nr .v{font-size:30px}.king .nm{font-size:23px}.st .bg{font-size:40px}}

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
function num(s){
  if(s==null) return NaN; s=String(s).replace(/[€%\s ]/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  return s===""?NaN:parseFloat(s);
}

  const soglia=(M.rules.join(" ").match(/almeno il\s*(\d+)\s*%/i)||[])[1];
  M.soglia=soglia?+soglia:CONFIG.soglia;
  const tt=M.rules.find(x=>/stagione/i.test(x)); if(tt) M.title=tt.replace(/\s*\n\s*/g," · ");

  // Classifica
  cl.forEach(r=>{ if(/^giornate$/i.test(cell(r,0))) M.giornate=num(r[1]); });
  const hi=cl.findIndex(r=>/^posizione$/i.test(cell(r,0)));
  if(hi>=0) for(let i=hi+1;i<cl.length;i++){const r=cl[i];
    if(!cell(r,1)) continue;
    const p=getP(M,cell(r,1),cell(r,2));
    p.pos=num(r[0]); p.giocate=num(r[3]); p.pctGiocate=num(r[4]); p.diff=num(r[5]); p.pctSet=num(r[6]);
    M.order.push(p.key);
  }
  M.order.forEach(k=>{const p=M.players[k]; p.dentro=!(p.pctGiocate<M.soglia);});

  // Set e Partite
  const sh=sp.findIndex(r=>cell(r,0)==="#");
  if(sh>=0){
    const H=sp[sh]; const dates=[];
    for(let c=3;c<H.length;c+=2) if(cell(H,c)) dates.push({label:cell(H,c),col:c});
    for(let i=sh+1;i<sp.length;i++){const r=sp[i];
      if(cell(r,0)==="#") break;
      if(!/^\d+$/.test(cell(r,0))||!cell(r,1)) continue;
      const p=getP(M,cell(r,1),cell(r,2));
      p.match=dates.map(d=>{const v=num(r[d.col]),l=num(r[d.col+1]);return (isNaN(v)&&isNaN(l))?null:{v:v||0,p:l||0};});
    }
    const all=Object.values(M.players).filter(p=>p.match);
    M.calendar=dates.map(d=>d.label);
    M.days=dates.map((d,j)=>({label:d.label,idx:j,n:all.filter(p=>p.match[j]).length})).filter(d=>d.n>0);
    all.forEach(p=>{p.setV=0;p.setP=0;p.match.forEach(m=>{if(m){p.setV+=m.v;p.setP+=m.p;}});});
  }

  // Quote
  const qh=q.findIndex(r=>cell(r,0)==="#");
  if(qh>=0){
    const H=q[qh]; const dates=[];
    for(let c=3;c<H.length;c+=2) if(cell(H,c)) dates.push({label:cell(H,c),col:c});
    let i=qh+1;
    for(;i<q.length;i++){const r=q[i];
      if(cell(r,0)==="#") break;
      if(!/^\d+$/.test(cell(r,0))||!cell(r,1)) continue;
      const p=getP(M,cell(r,1),cell(r,2));
      p.q=dates.map(d=>({c:!!cell(r,d.col),eur:num(r[d.col+1])}));
    }
    const all=Object.values(M.players).filter(p=>p.q);
    M.qdates=dates.map(d=>d.label);
    M.qdays=dates.map((d,j)=>({label:d.label,pres:all.filter(p=>p.q[j].c).length,inc:all.reduce((s,p)=>s+(isNaN(p.q[j].eur)?0:p.q[j].eur),0)})).filter(d=>d.pres>0);
    // riepilogo (Presenze / A carico / Versato / Da pagare)
    const sh2=q.findIndex((r,ix)=>ix>=i&&r.some(c=>/presenze/i.test(c||"")));
    let usato=false;
    if(sh2>=0){
      const H2=q[sh2], ix=n=>H2.findIndex(c=>new RegExp(n,"i").test(c||""));
      const cP=ix("presenze"),cA=ix("a carico"),cV=ix("versato"),cD=ix("da pagare");
      for(let j=sh2+1;j<q.length;j++){const r=q[j];
        if(!/^\d+$/.test(cell(r,0))||!cell(r,1)) continue;
        const p=getP(M,cell(r,1),cell(r,2));
        p.pres=num(r[cP]); p.carico=num(r[cA]); p.versato=num(r[cV]); p.dapagare=num(r[cD]); usato=true;
      }
    }
    if(!usato) all.forEach(p=>{p.pres=p.q.filter(x=>x.c).length;p.carico=p.pres*CONFIG.quota;
      p.versato=p.q.reduce((s,x)=>s+(isNaN(x.eur)?0:x.eur),0);p.dapagare=p.versato-p.carico;});
  }
  // statistiche ricalcolate da "Set e Partite" (più affidabili della scheda Classifica)
  if(M.days.length){
    M.giornate=M.days.length;
    const cmp=(a,b)=>(b.pctSet||0)-(a.pctSet||0)||b.diff-a.diff||b.pctGiocate-a.pctGiocate||b.setV-a.setV||a.cognome.localeCompare(b.cognome);
    const withM=Object.values(M.players).filter(p=>p.match&&p.match.some(Boolean));
    withM.forEach(p=>{const g=p.match.filter(Boolean).length,t=p.setV+p.setP;
      p.giocate=g; p.pctGiocate=g/M.giornate*100; p.pctSet=t?p.setV/t*100:NaN; p.diff=p.setV-p.setP; p.dentro=p.pctGiocate>=M.soglia;});
    const dentro=withM.filter(p=>p.dentro).sort(cmp), fuori=withM.filter(p=>!p.dentro).sort(cmp);
    M.order=[...dentro,...fuori].map(p=>p.key);
    M.order.forEach((k,i)=>M.players[k].pos=i+1);
  }
  // tabella "COSTO PALESTRA" nelle Quote: somma della colonna euro
  const ci=q.findIndex(r=>r.some(c=>/costo\s*palestra/i.test(c||"")));
  if(ci>=0){
    const hh=q.slice(ci,ci+3).find(r=>r.some(c=>/^euro$/i.test((c||"").trim())));
    const ce=hh?hh.findIndex(c=>/^euro$/i.test((c||"").trim())):-1, cm=hh?hh.findIndex(c=>/^mese$/i.test((c||"").trim())):-1;
    if(ce>=0){let tot=0,ok=false;M.mesiPalestra=[];
      for(let j=ci+1;j<q.length;j++){const r=q[j],m=cell(r,cm),v=num(r[ce]);
        if(!m&&isNaN(v)){if(ok)break;else continue;}
        if(/^mese$/i.test(m))continue;
        if(!isNaN(v)){tot+=v;ok=true;if(v>0)M.mesiPalestra.push({mese:m,euro:v});}}
      if(ok) M.costoPalestra=tot;}
  }
  // voci di riepilogo nelle Quote (es. "NETTO - USABILE")
  M.voci={};
  q.forEach(r=>{const lab=cell(r,3); if(!lab||/^\d/.test(lab)) return;
    for(let c=r.length-1;c>3;c--){const v=num(r[c]); if(!isNaN(v)){M.voci[lab.toLowerCase().replace(/\s+/g," ")]=v;break;}}});
  const vk=Object.keys(M.voci).find(k=>/netto.*usabile/.test(k)); M.nettoUsabile=vk?M.voci[vk]:null;
  // giocatori non in classifica (es. nuovi) in fondo
  Object.keys(M.players).forEach(k=>{if(!M.order.includes(k)){M.order.push(k);M.players[k].dentro=false;}});
  if(isNaN(M.giornate)||M.giornate==null) M.giornate=M.days.length;
  return M;
}
function getP(M,c,n){const k=keyOf(c,n);
  if(!M.players[k]) M.players[k]={key:k,cognome:c.trim(),nome:n.trim(),nomeCompleto:(n.trim()+" "+c.trim())};
  return M.players[k];}

const pending={};let seq=0;
window.__kovNative=function(id,ok,body){const p=pending[id];if(!p)return;delete pending[id];ok?p.res(body):p.rej(new Error(body));};
function nativeGet(url){return new Promise((res,rej)=>{const id=++seq;pending[id]={res,rej};window.KovNative.get(url,String(id));
  setTimeout(()=>{if(pending[id]){delete pending[id];rej(new Error("timeout"));}},20000);});}
async function getCSV(name){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/export?format=csv&gid=${CONFIG.gids[name]}&t=${Date.now()}`;
  let t;
  if(window.KovNative) t=await nativeGet(url);
  else{const wurl=CONFIG.pubId?`https://docs.google.com/spreadsheets/d/e/${CONFIG.pubId}/pub?gid=${CONFIG.gids[name]}&single=true&output=csv&t=${Date.now()}`:url;
    const r=await fetch(wurl,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);t=await r.text();}
  if(/^\s*</.test(t)) throw new Error("Il foglio non è condiviso con 'chiunque abbia il link'");
  return t;
}

function dots(pct,o){

function nextDate(){

  const toD=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);};
  let d=(MODEL.calendar||[]).map(toD).filter(x=>x&&x>=t).sort((a,b)=>a-b)[0];
  if(!d){d=new Date(t);d.setDate(d.getDate()+((8-d.getDay())%7));}
  const GG=["dom","lun","mar","mer","gio","ven","sab"];
  return (d.getTime()===t.getTime()?"stasera":GG[d.getDay()])+" "+d.getDate()+" "+MESI[d.getMonth()];

function viewRegole(){
  const raw=MODEL.rules.filter(x=>!/stagione|^regolamento:?$/i.test(x)).join("\n\n");
  const all=raw.replace(/\r/g,"");
  // --- righe: va a capo anche dove ci sono 3+ spazi seguiti da maiuscola o elenco
  const lines=all.split("\n").flatMap(l=>l.split(/\s{3,}(?=[A-ZÀ-Ý*•\-])/)).map(l=>l.trim());
  const isItem=l=>/^([*•\-–]|\d+[.)])\s+/.test(l);
  const stripItem=l=>l.replace(/^([*•\-–]|\d+[.)])\s+/,"");
  const isHead=(l,next)=>l&&!isItem(l)&&l.length<=48&&/^[A-ZÀ-Ý]/.test(l)&&!/[.:;,!?]$/.test(l)&&next!==undefined&&next!=="";
  // --- blocchi: {title, paras:[], items:[], intro}
  const secs=[];let cur=null,afterColon=false;
  const ns=()=>{cur={title:"",paras:[],items:[],intro:""};secs.push(cur);};
  ns();
  lines.forEach((l,i)=>{
    if(!l){afterColon=false;return;}
    const nxt=lines.slice(i+1).find(x=>x!==undefined);
    if(isItem(l)||afterColon){cur.items.push(stripItem(l));return;}
    if(isHead(l,nxt)){ if(cur.title||cur.paras.length||cur.items.length) ns(); cur.title=l; return; }
    if(/:$/.test(l)){ if(cur.items.length){ns();} cur.intro=l.replace(/:$/,""); afterColon=true; return; }
    cur.paras.push(l);
  });
  const S=secs.filter(s=>s.title||s.paras.length||s.items.length);
  // --- frasi -> card con icona
  const sentences=t=>t.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý])/).map(x=>x.trim()).filter(Boolean);
  const IC={
    clock:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>`,
    pin:`<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>`,
    cal:ICON.cal, cup:ICON.cup, ppl:ICON.ppl, ball:ICON.ball,
    pct:`<svg viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>`,
  };
  const iconFor=t=>/\d+\s*%|almeno/i.test(t)?IC.pct:/palestra|presso/i.test(t)?(/\d{1,2}[:.]\d{2}/.test(t)?IC.clock:IC.pin):/\d{1,2}[:.]\d{2}|sera|lunedì|martedì|mercoledì|giovedì|venerdì/i.test(t)?IC.clock:/settembre|ottobre|gennaio|maggio|giugno|stagione|\b20\d\d\b/i.test(t)?IC.cal:/squadr|contro|vs\.?/i.test(t)?IC.ppl:/classific|graduatoria/i.test(t)?IC.cup:IC.ball;
  const hl=t=>esc(t)
    .replace(/(\d{1,2}[:.]\d{2})/g,"<b>$1</b>")
    .replace(/(\d+\s*%)/g,"<b>$1</b>")
    .replace(/\b(Palestra\s+[A-ZÀ-Ý][\wàèéìòù]+)/g,"<b>$1</b>")
    .replace(/\b(ogni\s+(?:lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica))/gi,"<b>$1</b>")
    .replace(/\b((?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+20\d\d)/gi,"<b>$1</b>");
  // squadre tipo "1°-3°-5° vs. 2°-4°-6°"
  const teams=t=>{const m=t.match(/((?:\d+°\s*-\s*)+\d+°)\s*vs\.?\s*((?:\d+°\s*-\s*)+\d+°)/i);if(!m)return "";
    const a=m[1].split(/\s*-\s*/),b=m[2].split(/\s*-\s*/);
    return `<div class="rteams"><div class="tm l">${a.map(x=>`<span>${esc(x)}</span>`).join("")}</div><div class="vs">VS</div><div class="tm">${b.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`;};
  // --- "in breve"
  const day=(all.match(/ogni\s+(lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica)/i)||[])[1];
  const tm=all.match(/(\d{1,2}[:.]\d{2})\s*(?:alle|-|–|a)\s*(\d{1,2}[:.]\d{2})/i);
  const place=(all.match(/\b(Palestra\s+[A-ZÀ-Ý][\wàèéìòù]+)/)||[])[1];
  const per=all.match(/da\s+(\w+\s+20\d\d)\s+a\s+(\w+\s+20\d\d)/i);
  const chips=[day&&["cal","Ogni "+day.toLowerCase()],tm&&["clock",tm[1].replace(".",":")+" – "+tm[2].replace(".",":")],place&&["pin",place],["pct","Min. "+MODEL.soglia+"% presenze"]].filter(Boolean);
  const brief=`<div class="rhero"><div class="rk">IN BREVE</div>
    ${per?`<div class="rper">${esc(per[1])} → ${esc(per[2])}</div>`:""}
    <div class="rchips">${chips.map(([i,t])=>`<span>${IC[i]}${esc(t)}</span>`).join("")}</div></div>`;
  const secHTML=S.map((s,si)=>`<div class="rsec" style="--d:${si}">
    ${s.title?`<div class="rh"><span class="rn">${String(si+1).padStart(2,"0")}</span>${esc(s.title)}</div>`:""}
    ${s.paras.flatMap(sentences).map(t=>`<div class="rfact"><div class="ic">${iconFor(t)}</div><div class="tx">${hl(t)}${teams(t)}</div></div>`).join("")}
    ${s.intro?`<div class="rintro">${hl(s.intro)}</div>`:""}
    ${s.items.length?`<ol class="rsteps">${s.items.map((it,i)=>`<li style="--k:${i}"><span class="n ${i===0?"l":i===1?"p2":i===2?"p3":""}">${i+1}</span><span class="t">${hl(it)}</span>${i===0?`<span class="tg">decisivo</span>`:""}</li>`).join("")}</ol>`:""}
  </div>`).join("");
  return `<h1 class="big">Regola<em>mento</em>${ARROW}</h1><p class="sub">${esc(((MODEL.title.match(/stagione.*/i)||[MODEL.title])[0]).replace(/^s/,"S"))}</p>${secHTML||`<div class="rules">${esc(all)}</div>`}`;
}

function openP(k){

  const wins=ms.filter(m=>m&&m.v>m.p).length, played=ms.filter(Boolean).length;
  const gioc=isNaN(p.giocate)?played:p.giocate;
  const hist=(p.q||[]).map((x,j)=>({lab:(MODEL.qdates||[])[j],c:x.c,eur:x.eur,paid:!isNaN(x.eur)&&x.eur>0})).filter(x=>x.c||x.paid).reverse();

    ${barsHTML(days.map((d,i)=>{const m=ms[i];return m?{h:m.v/Math.max(1,m.v+m.p),lab:short(d.label),hi:i===bestI,tip:m.v+"–"+m.p,txt:m.v+"-"+m.p}:{none:1,lab:short(d.label)};}))}</div>`:""}

function themePref(){const t=load("kov_theme");return (t==="light"||t==="dark")?t:"auto";}
function sysTheme(){return (window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
function applyTheme(){
  const pref=themePref(), t=pref==="auto"?sysTheme():pref;
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",t==="light"?"#ecece7":"#0b0b0b");
  const b=document.getElementById("themeBtn"); if(b) b.setAttribute("aria-label",t==="light"?"Passa al tema scuro":"Passa al tema chiaro");
  try{ if(window.KovNative&&KovNative.setBars) KovNative.setBars(t==="light"); }catch(e){}   // APK ≥ 1.3: colora le barre di Android
}
document.getElementById("themeBtn").onclick=()=>{
  const now=document.documentElement.getAttribute("data-theme");
  store("kov_theme",now==="light"?"dark":"light"); applyTheme();
};
if(window.matchMedia){const mq=matchMedia("(prefers-color-scheme: light)");
  if(mq.addEventListener) mq.addEventListener("change",applyTheme); else if(mq.addListener) mq.addListener(applyTheme);}
applyTheme();

document.getElementById("ver").textContent="versione "+VER();
render(); refresh(); checkUpdate();
setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.remove();},2700);
</script>
</body>
